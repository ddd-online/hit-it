version: 1

default:
  one_word_executable: true
  collapse_veto: false
  weak_market_gate:
    max_picks: 1
    min_score: 85
    override:
      enabled: true
      theme_score_threshold: 80
      min_score_by_mode:
        one_to_two: 80
        two_to_three: 79
  second_line:
    admission: strict
    retreat_cap: watch_only
